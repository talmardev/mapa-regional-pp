<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#231b13">
<title>Mapa Regional++</title>
<link rel="icon" type="image/png" href="media/favicon.png">
<meta name="description" content="Ferramenta para medir distâncias, áreas e tempos de viagem no Mapa Regional, no navegador do computador ou do telemóvel.">
<!-- Pré-visualização do link ao partilhar (Discord, redes sociais). A imagem precisa do endereço completo. -->
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_PT">
<meta property="og:title" content="Mapa Regional++">
<meta property="og:description" content="Ferramenta para medir distâncias, áreas e tempos de viagem no Mapa Regional, no navegador do computador ou do telemóvel.">
<meta property="og:url" content="https://talmardev.github.io/mapa-regional-pp/">
<meta property="og:image" content="https://talmardev.github.io/mapa-regional-pp/media/homepage_pc.png">
<meta property="og:image:width" content="1919">
<meta property="og:image:height" content="989">
<meta property="og:image:alt" content="O Mapa Regional++ no computador, com o mapa todo à vista">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- As fontes carregam sem bloquear: o mapa começa a descarregar logo -->
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="palco">
  <canvas id="mapa" aria-label="Mapa regional. Clica para marcar pontos."></canvas>
  <div id="estado" role="status">A carregar o mapa…</div>
  <div id="zoom">
    <button id="zoomMais" aria-label="Aproximar">+</button>
    <button id="zoomMenos" aria-label="Afastar">−</button>
    <button id="zoomTudo" aria-label="Ver o mapa todo">⤢</button>
  </div>
  <div id="coordenadas">x –, y –</div>

  <aside id="painel">
    <div id="pega" role="separator" aria-orientation="horizontal" aria-label="Arrasta para mudar o tamanho do painel" aria-valuemin="12" tabindex="0"></div>
    <header>
      <h1>Mapa Regional++</h1>
      <p class="subtitulo" id="notaEscala"></p>
    </header>
    <section class="sempre">
      <div class="segmentos" role="group" aria-label="Tipo de medição">
        <button id="modoDist" aria-pressed="true">Distância</button>
        <button id="modoArea" aria-pressed="false">Área</button>
      </div>
    </section>
    <section class="resultado sempre">
      <p class="grande" id="valorGrande">0<small>km</small></p>
      <p id="valorSub">Clica no mapa para marcar o primeiro ponto.</p>
      <div id="aviso" class="aviso escondido" role="alert"></div>
    </section>
    <section class="sempre">
      <div class="linha">
        <button class="botao" id="desfazer">Desfazer ponto</button>
        <button class="botao" id="limpar">Limpar</button>
        <button class="botao principal" id="copiar">Copiar</button>
      </div>
    </section>
    <section id="caixaViagem" class="escondido">
      <h2>Tempo de Viagem</h2>
      <div class="segmentos" id="gruposViagem" role="group" aria-label="Grupo de meios"></div>
      <div id="avisoMar" class="aviso escondido" role="status">O percurso passa por terra. Marca o percurso por mar com vários pontos.</div>
      <table class="viagem">
        <thead><tr><th></th><th>Cruzeiro</th><th>Máxima</th></tr></thead>
        <tbody id="viagem"></tbody>
      </table>
    </section>
    <section>
      <h2>Converter distâncias</h2>
      <div class="conversor">
        <label>Km Vida Real<input id="kmVidaReal" inputmode="decimal"></label>
        <label>Km Mapa<input id="kmMapa" inputmode="decimal"></label>
      </div>
    </section>
    <section>
      <h2>Mapa</h2>
      <label class="botao bloco">Carregar outra edição do mapa
        <input type="file" id="ficheiro" accept="image/*" class="ficheiro-escondido">
      </label>
    </section>
  </aside>

  <!-- Notificação dos créditos: o app.js mostra-a ao abrir o site, com a probabilidade do config.js -->
  <template id="modeloCreditos">
    <aside class="creditos" aria-label="Créditos">
      <div class="bandeiras">
        <a href="https://www.nationstates.net/nation=new_libertalia_kingdom" target="_blank" rel="noopener"><img src="media/nlk.png" width="405" height="284" fetchpriority="high" alt="Bandeira de New Libertalia Kingdom"></a>
        <a href="https://www.nationstates.net/nation=alentejo_and_algarve" target="_blank" rel="noopener"><img src="media/a&amp;a.png" width="426" height="284" fetchpriority="high" alt="Bandeira de Alentejo and Algarve"></a>
      </div>
      <a class="logo" href="https://www.nationstates.net/page=dispatch/id=861852" target="_blank" rel="noopener"><img src="media/drcartogarifa.png" width="625" height="281" fetchpriority="high" alt="Departamento Regional de Cartografia"></a>
      <p>Esta ferramenta foi desenvolvida por <a href="https://www.nationstates.net/nation=new_libertalia_kingdom" target="_blank" rel="noopener">New Libertalia Kingdom</a> com base no mapa mantido pelo nosso querido cartógrafo regional <a href="https://www.nationstates.net/nation=alentejo_and_algarve" target="_blank" rel="noopener">Alentejo and Algarve</a>.</p>
    </aside>
  </template>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
